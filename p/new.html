<script src="../firebase-config.js?v=20261127h"></script>
<script>
(function(){
  var T={HIK:"كاميرات وأجهزة هيكفيجن",EZVIZ:"كاميرات إيزفيز",NET:"أجهزة الشبكات",NONCCTV:"شاشات وإكسسوارات"};
  var cfg=window.FIREBASE_CONFIG;
  var fn=new URLSearchParams(location.search).get("fn")||"";
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  if(!cfg||!cfg.apiKey||cfg.apiKey==="PENDING"||!fn){document.getElementById("model").textContent="المنتج غير موجود";return;}
  var V="10.12.2";
  function load(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
  var base="https://www.gstatic.com/firebasejs/"+V+"/";
  Promise.all([load(base+"firebase-app-compat.js"),load(base+"firebase-firestore-compat.js")]).then(function(){
    try{firebase.initializeApp(cfg);}catch(e){}
    firebase.firestore().collection("products").doc(encodeURIComponent(fn)).get().then(function(d){
      if(!d.exists){document.getElementById("model").textContent="المنتج غير موجود";return;}
      var m=d.data();
      document.title=(m.model||fn)+" - "+(m.name||"");
      document.getElementById("cat").textContent=T[m.tab]||"منتج";
      document.getElementById("model").textContent=m.model||fn;
      var wa=document.querySelector(".cta a.btn"); if(wa&&wa.href.indexOf("wa.me")>-1) wa.href=wa.href+"?text="+encodeURIComponent("السلام عليكم، أستفسر عن الموديل "+(m.model||fn));
      document.getElementById("name").textContent=m.name||"";
      if(m.img){var ib=document.getElementById("imgbox");ib.style.display="";document.getElementById("img").src=m.img;document.getElementById("img").alt=m.model||fn;}
      if(Array.isArray(m.feats)&&m.feats.length)document.getElementById("feats").innerHTML=m.feats.map(function(x){return "<div>"+esc(x)+"</div>";}).join("");
      if(m.price){document.getElementById("pricebox").style.display="";document.getElementById("price").textContent=m.price;}
    }).catch(function(){document.getElementById("model").textContent="حصل خطأ في التحميل";});
  }).catch(function(){document.getElementById("model").textContent="حصل خطأ في التحميل";});
})();
</script>
